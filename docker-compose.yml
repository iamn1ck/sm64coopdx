services:
  termux-sm64coopdx:
    image: sm64coopdx-build-env
    # needed for arm emulaton on x86_64 hosts
    platform: linux/arm64
    container_name: sm64coopdx-build-env
    # needed to fix networking issue
    network_mode: host
    privileged: true
    environment:
      ANDROID_ROOT: /system
      ANDROID_DATA: /data
      PREFIX: /data/data/com.termux/files/usr
      HOME: /data/data/com.termux/files/home
      PATH: /data/data/com.termux/files/usr/bin
      TMPDIR: /data/data/com.termux/files/usr/tmp
      LANG: en_US.UTF-8
      TZ: UTC
    volumes:
      - /tmp/node20:/__e/node20
      - ./:/data/data/com.termux/files/home/sm64coopdx
    command: tail -f /dev/null
